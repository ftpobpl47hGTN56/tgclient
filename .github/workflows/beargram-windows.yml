name: BearGram Windows build

# Builds BearGram.exe (Release, x64) and publishes it in GitHub Releases.
# Based on the upstream win.yml. Runs on every push to the beargram branch,
# after the daily sync merges a new Telegram release, and by hand
# (Actions > BearGram Windows build > Run workflow).
#
# API keys: set the repository secrets TDESKTOP_API_ID and TDESKTOP_API_HASH
# (Settings > Secrets and variables > Actions). Without them the build uses
# the open credentials of Telegram Desktop, the same as its nightly builds.

on:
  push:
    branches:
      - beargram
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'beargram/icon_master.png'
      - 'beargram/make_icons.py'
      - '.github/workflows/beargram-sync.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the build in Releases'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: beargram-windows
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 360

    env:
      PREPARE_PATH: "Telegram/build/prepare/prepare.py"

    defaults:
      run:
        shell: cmd

    steps:
      # A build of all libraries from scratch needs more space than the
      # runner has free: the first run failed with "not enough space on the
      # disk". Tools BearGram doesn't need are removed, and the build folder
      # goes to the drive with more free space.
      - name: Free disk space.
        shell: pwsh
        run: |
          Get-PSDrive -PSProvider FileSystem | Format-Table Name, @{n='FreeGB';e={[math]::Round($_.Free/1GB,1)}}, @{n='UsedGB';e={[math]::Round($_.Used/1GB,1)}}
          $paths = @(
            'C:\Android',
            'C:\ghcup',
            'C:\Strawberry',
            'C:\Miniconda',
            'C:\mingw64',
            'C:\msys64',
            'C:\rtools45',
            'C:\rtools44',
            'C:\tools\php',
            'C:\selenium',
            'C:\SeleniumWebDrivers',
            'C:\Program Files\Microsoft SQL Server',
            'C:\Program Files\MongoDB',
            'C:\Program Files\PostgreSQL',
            'C:\Program Files\MySQL',
            'C:\Program Files\Google\Chrome',
            'C:\Program Files\Mozilla Firefox',
            'C:\Program Files (x86)\Android',
            'C:\Program Files\dotnet\sdk\6.0*',
            'C:\Program Files\dotnet\sdk\7.0*',
            'C:\hostedtoolcache\windows\CodeQL',
            'C:\hostedtoolcache\windows\go',
            'C:\hostedtoolcache\windows\Java_*',
            'C:\hostedtoolcache\windows\Ruby',
            'C:\hostedtoolcache\windows\PyPy',
            'C:\hostedtoolcache\windows\node'
          )
          foreach ($path in $paths) {
            Get-Item -Path $path -ErrorAction SilentlyContinue | ForEach-Object {
              Write-Host "Removing $($_.FullName)"
              cmd /c "rmdir /s /q `"$($_.FullName)`"" 2>$null
            }
          }
          Get-PSDrive -PSProvider FileSystem | Format-Table Name, @{n='FreeGB';e={[math]::Round($_.Free/1GB,1)}}

      - name: Prepare directories.
        shell: pwsh
        run: |
          $drives = Get-PSDrive -PSProvider FileSystem | Where-Object { $_.Name -in @('C', 'D') -and $_.Free }
          $best = $drives | Sort-Object Free -Descending | Select-Object -First 1
          $root = if ($best.Name -eq 'C') { "$env:USERPROFILE\TBuild" } else { "$($best.Name):\TBuild" }
          Write-Host "Building on drive $($best.Name): ($([math]::Round($best.Free/1GB,1)) GB free) in $root"
          New-Item -ItemType Directory -Force -Path "$root\Libraries" | Out-Null
          cmd /c mklink /d "$env:GITHUB_WORKSPACE\TBuild" "$root"
          "TBUILD=$env:GITHUB_WORKSPACE\TBuild" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "LibrariesPath=$env:GITHUB_WORKSPACE\TBuild\Libraries\win64" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Get repository name.
        shell: bash
        run: echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> $GITHUB_ENV

      - name: Clone.
        uses: actions/checkout@v7
        with:
          submodules: recursive
          path: ${{ env.TBUILD }}\${{ env.REPO_NAME }}

      - name: First set up.
        shell: bash
        run: |
          DOCPATH=$TBUILD/$REPO_NAME/docs/building-win.md
          SDK="$(grep "SDK version" $DOCPATH | sed -r 's/.*\*\*(.*)\*\* SDK version.*/\1/')"
          echo "SDK=$SDK" >> $GITHUB_ENV

          echo "$(sha256sum $TBUILD/$REPO_NAME/$PREPARE_PATH | awk '{ print $1 }')" >> CACHE_KEY.txt
          echo "$SDK" >> CACHE_KEY.txt
          echo "CACHE_KEY=$(sha256sum CACHE_KEY.txt | awk '{ print $1 }')" >> $GITHUB_ENV

          VERSION="$(sed -n 's/^constexpr auto AppVersionStr = "\(.*\)";.*/\1/p' $TBUILD/$REPO_NAME/Telegram/SourceFiles/core/version.h)"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "RELEASE_TAG=beargram-$VERSION-build$GITHUB_RUN_NUMBER" >> $GITHUB_ENV

          echo "Configure git for cherry-picks in prepare."
          git config --global user.email "you@example.com"
          git config --global user.name "Sample"

      - uses: Eden-CI/msvc-dev-cmd@master
        name: Native Tools Command Prompt.
        with:
          arch: x64
          sdk: ${{ env.SDK }}
          toolset: '14.44'

      - name: NuGet sources.
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages"
          nuget sources Add -Source https://api.nuget.org/v3/index.json & exit 0

      # Caches are restored here and saved right after the libraries are
      # built, so a failure in the BearGram build itself doesn't throw away
      # the hour spent on the libraries.
      - name: ThirdParty cache.
        id: cache-third-party
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ runner.OS }}-${{ runner.arch }}-third-party-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-${{ runner.arch }}-third-party-

      - name: Libraries cache.
        id: cache-libs
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-x64-libs-v3-${{ env.CACHE_KEY }}
          restore-keys: |
            ${{ runner.OS }}-x64-libs-v3-
            ${{ runner.OS }}-x64-libs-v2-

      - name: Qt cache.
        id: cache-qt
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-x64-qt-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-x64-qt-

      # The prune below used to delete the generated sources of tdesktop_rust
      # (out/src/wallet_engine/*.cpp) while its stage key stayed in the cache,
      # so CMake couldn't find wallet_engine.cpp. When they are missing, the
      # stage keys are dropped and prepare builds these three stages again.
      - name: Repair the tdesktop_rust cache.
        shell: bash
        run: |
          if [ -d "$LibrariesPath/tdesktop_rust" ] \
            && [ ! -f "$LibrariesPath/tdesktop_rust/out/src/wallet_engine/wallet_engine.cpp" ]; then
            echo "Generated tdesktop_rust sources are missing, rebuilding the stage."
            for stage in tdesktop_rust tlottie wallet-engine; do
              rm -rf "$LibrariesPath/$stage" "$LibrariesPath/cache_keys/$stage"
            done
          else
            echo "tdesktop_rust cache is fine."
          fi

      - name: Libraries.
        run: |
          %TBUILD%\%REPO_NAME%\Telegram\build\prepare\win.bat skip-release silent

      - name: Free up some disk space.
        shell: bash
        run: find $LibrariesPath '(' '(' ! '(' -name '*.lib' -o -name '*.a' -o -name '*.exe' -o -name '*.h' -o -name '*.hpp' -o -name '*.inc' -o -name '*.cmake' -o -name '*.pc' -o -path '*/include/*' -o -path '*/objects-*' -o -path '*/cache_keys/*' -o -path '*/patches/*' -o -path '*/nv-codec-headers/*' -o -path '*/tdesktop_rust/out/*' ')' -type f ')' -o -empty ')' -delete

      - name: Save ThirdParty cache.
        if: steps.cache-third-party.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ runner.OS }}-${{ runner.arch }}-third-party-${{ env.CACHE_KEY }}

      - name: Save Libraries cache.
        if: steps.cache-libs.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-x64-libs-v3-${{ env.CACHE_KEY }}

      - name: Save Qt cache.
        if: steps.cache-qt.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-x64-qt-${{ env.CACHE_KEY }}

      - name: Disk space before the build.
        shell: pwsh
        run: Get-PSDrive -PSProvider FileSystem | Format-Table Name, @{n='FreeGB';e={[math]::Round($_.Free/1GB,1)}}

      - name: API credentials.
        shell: bash
        env:
          API_ID: ${{ secrets.TDESKTOP_API_ID }}
          API_HASH: ${{ secrets.TDESKTOP_API_HASH }}
        run: |
          if [ -n "$API_ID" ] && [ -n "$API_HASH" ]; then
            echo "Using own API credentials from secrets."
          else
            echo "No secrets set, using the open Telegram Desktop credentials."
            API_ID=611335
            API_HASH=d524b414d21f4d37f08684c1df41ac9c
          fi
          echo "::add-mask::$API_HASH"
          echo "TDESKTOP_BUILD_API=-D TDESKTOP_API_ID=$API_ID -D TDESKTOP_API_HASH=$API_HASH" >> $GITHUB_ENV

      # The output also goes to build.log: when the step fails, the next step
      # puts the end of the log and the error lines into the run annotations,
      # which can be read without downloading the full log.
      - name: BearGram build.
        run: |
          cd %TBUILD%\%REPO_NAME%\Telegram

          call configure.bat x64 ^
          %TDESKTOP_BUILD_API% ^
          -D CMAKE_CONFIGURATION_TYPES=Release ^
          -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON ^
          -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON > %GITHUB_WORKSPACE%\build.log 2>&1
          set CONFIGURE_RESULT=%errorlevel%
          type %GITHUB_WORKSPACE%\build.log
          if not "%CONFIGURE_RESULT%"=="0" (
            echo configure.bat failed with %CONFIGURE_RESULT%
            exit /b 1
          )

          cmake --build ..\out --config Release --parallel --target Telegram > %GITHUB_WORKSPACE%\compile.log 2>&1
          set BUILD_RESULT=%errorlevel%
          type %GITHUB_WORKSPACE%\compile.log
          if not "%BUILD_RESULT%"=="0" (
            echo cmake --build failed with %BUILD_RESULT%
            exit /b 1
          )

      - name: Report the build error.
        if: failure()
        shell: bash
        run: |
          report() {
            local title="$1" file="$2"
            [ -f "$file" ] || return 0
            {
              echo "### $title"
              echo '```'
              grep -n -E "error [A-Z]+[0-9]+|fatal error|CMake Error|FAILED|Error:|error:" "$file" | head -40
              echo '...'
              tail -n 60 "$file"
              echo '```'
            } > report.txt
            cat report.txt >> "$GITHUB_STEP_SUMMARY"
            # Annotations keep newlines encoded as %0A.
            local text
            text="$(sed -e 's/%/%25/g' -e 's/\r//g' report.txt | awk 'BEGIN{ORS="%0A"} {print}')"
            echo "::error title=$title::${text:0:60000}"
          }
          report "configure.bat" "$GITHUB_WORKSPACE/build.log"
          report "cmake --build" "$GITHUB_WORKSPACE/compile.log"

      - name: Disk space after a failure.
        if: failure()
        shell: pwsh
        run: Get-PSDrive -PSProvider FileSystem | Format-Table Name, @{n='FreeGB';e={[math]::Round($_.Free/1GB,1)}}

      - name: Package.
        shell: bash
        run: |
          OUT="$TBUILD/$REPO_NAME/out/Release"
          mkdir -p package/BearGram
          cp "$OUT/BearGram.exe" package/BearGram/
          cd package
          7z a -tzip "../BearGram-$VERSION-x64.zip" BearGram > /dev/null
          cd ..
          ls -l "BearGram-$VERSION-x64.zip"

      - name: Upload artifact.
        uses: actions/upload-artifact@v7
        with:
          name: BearGram-${{ env.VERSION }}-x64
          path: BearGram-${{ env.VERSION }}-x64.zip
          retention-days: 7

      - name: Publish release.
        if: github.event_name != 'workflow_dispatch' || inputs.publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" "BearGram-$VERSION-x64.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "BearGram $VERSION (build $GITHUB_RUN_NUMBER)" \
            --notes "Telegram Desktop $VERSION with BearGram changes. Commit $GITHUB_SHA." \
            --latest
